name: Release & Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish packages to PyPI"
        type: boolean
        default: true

jobs:
  build-dist:
    name: Build Wheels and Sdist
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build distributions
        run: uv build

      - name: Upload wheel and sdist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/*
          if-no-files-found: error

  build-macos-app:
    name: Build macOS Application Bundle
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Build Clownfish.app and archive
        run: uv run --with pyinstaller python scripts/build_macos_app.py

      - name: Upload macOS application archive
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-archive
          path: dist/Clownfish-*-macos.zip
          if-no-files-found: error

  pypi-publish:
    name: Publish to PyPI
    needs: [build-dist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/clownfish
    permissions:
      id-token: write
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish_pypi)
    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    name: Create GitHub Release
    needs: [build-dist, build-macos-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download dist packages
        uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist/

      - name: Download macOS app archive
        uses: actions/download-artifact@v4
        with:
          name: macos-app-archive
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/Clownfish-*-macos.zip
          generate_release_notes: true
