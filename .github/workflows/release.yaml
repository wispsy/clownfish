name: Release package
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  build:
    name: Build and qualify release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - run: git merge-base --is-ancestor HEAD origin/main
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.13.9'
          python-version: '3.14'
      - run: uv build --out-dir dist
      - name: Validate selected release identity and payload
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: uv run --no-project python scripts/check_release.py dist --tag "$RELEASE_TAG"
      - name: Qualify the artifacts selected for publication
        run: uv run --no-project --python 3.14 python scripts/qualify.py dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-receipt
          path: release-artifacts.json
          if-no-files-found: error
  publish:
    name: Publish qualified release
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/clownfish
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086

  build-macos-app:
    name: Build macOS Application Bundle
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Build Clownfish.app and archive
        run: uv run --with pyinstaller python scripts/build_macos_app.py

      - name: Upload macOS application archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-app-archive
          path: dist/Clownfish-*-macos.zip
          if-no-files-found: error

  attach-macos-app:
    name: Attach macOS application bundle
    needs: build-macos-app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: macos-app-archive
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.zip --repo "$GITHUB_REPOSITORY"
